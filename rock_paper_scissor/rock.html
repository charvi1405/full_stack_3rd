<!DOCTYPE html>
<head>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
<h3>Player 1</h3>
<button onclick="play(1,'Rock')">Rock</button>
<button onclick="play(1,'Paper')">Paper</button>
<button onclick="play(1,'Scissors')">Scissors</button>

<h3>Player 2</h3>
<button onclick="play(2,'Rock')">Rock</button>
<button onclick="play(2,'Paper')">Paper</button>
<button onclick="play(2,'Scissors')">Scissors</button>

<h3 id="result">Result will appear here</h3>

<script>
    let p1 = "";
    let p2 = "";

    function play(player, choice) {
        if (player == 1) {
            p1 = choice;
        } else {
            p2 = choice;
        }

        if (p1 != "" && p2 != "") {
            if (p1 == p2) {
                document.getElementById("result").innerHTML = "Draw!";
            } else if (
                (p1 == "Rock" && p2 == "Scissors") ||
                (p1 == "Paper" && p2 == "Rock") ||
                (p1 == "Scissors" && p2 == "Paper")
            ) {
                document.getElementById("result").innerHTML = "Player 1 Wins!";
            } else {
                document.getElementById("result").innerHTML = "Player 2 Wins!";
            }

            p1 = "";
            p2 = "";
        }
    }
</script>
</body>
</html>
