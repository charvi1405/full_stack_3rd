<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin-top:3px;
            margin-right:3px;
            margin-left:3px;
        }

        body {
            background: #f4f4f4;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000000;
            color: #ffffff;
            padding: 18px 60px;
            border-radius: 20px;
        }

        .brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #00bfff;
        }
        #login-link{
            height:40px;
            width:60px;
            background-color:blue;
            text-align:center;
            border-radius:10px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">TechNova</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <div id ="login-link">
                <a href="#">Login</a>
            </div>
        </div>
    </nav>
</body>
</html>
