<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @layer special,base;
        @layer base{ 
            body{
                background-color:white;
            }       
        p{
            font-size:30px;
            color:red;
        }
    button{
        font-size:20px;
        border-radius:50%;
        width:150px;
        height:150px;
        background-color:white;
        border:1px solid grey;
        box-shadow: inset 3px 3px 5px grey;
    }
    button:active{
        box-shadow:inset 3px 3px 5px grey;


    }}
        @layer special{
            body{
                background-color:black;
            }
        p{
            color:blue;
        }button{
            background-color:white;
            box-shadow: inset 3px 3px 5px white;
        }
        button:active{
            box-shadow:inset 3px 3px 5px white;
    }}
    </style>
</head>
<body>
    <p> specificity! </p>
    <button>click me</button>
    
</body>
</html>
