<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Donut</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .donut {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(#22c55e 0% 72%, #cbd5e1 72% 100%);
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .donut::before {
            content: "";
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: white;
        }

        .text {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="donut">
        <div class="text">72%</div>
    </div>
</body>
</html>
