<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
        flex-direction:row;
        outline:3px solid black;
        display:flex;
    }
    .container>div{
        color:white;
        flex-shrink:3;
        height:100px;
    }
    #box1{
        background-color:blue;
        flex-basis:150px;
        flex-grow:2;
    }
    #box2{
        background-color:violet;
        flex-basis:150px;
        flex-grow:3;
    }
    #box3{
        background-color:red;
        flex-basis:150px;
        flex-grow:2;
    }
</style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
    </div>
</body>
</html>
