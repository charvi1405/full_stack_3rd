<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            outline:1px solid red;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            height:500px;
            width:500px;
        }
        .container>div{
            outline:1px solid blue;
            font-size: 24px
        }
        #box1 {
            grid-column: 1 / 3;
            grid-column-start:1;
            grid-column-end: 3;
            grid-row-start:1;
            grid-row-end: 3;
            background-image: linear-gradient(to top, rgb(4, 66, 108), rgb(32, 154, 231));
            
        }
        #box6{
            grid-column:2/3;
            grid-row:1/2;
            background-image: linear-gradient(to top, rgb(36, 84, 5), rgb(9, 210, 36));
            
        }
        #box4{
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            background-image: linear-gradient(to top, rgb(84, 5, 5), rgb(210, 9, 9));
        }
    </style>
</head>
<body>
    <div class = "container">
        <div  id = "box1">1</div>
        <div  id = "box2">2</div>
        <div  id = "box3">3</div>
        <div  id = "box4">4</div>
        <div  id = "box5">5</div>
        <div  id = "box6">6</div>

    </div>
</body>
</html>
