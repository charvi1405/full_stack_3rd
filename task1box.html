<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Images</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
        }

        .sticky-image {
            position: sticky;
            top: 50px;
            left: 50px;
            right: 50px;
            display: block;
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <main>
        <img class="sticky-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9aV0hb4Mwn9vSzxx5poO35rPsivrqb-n2q54qZ5Aj9Q&s=10" alt="Anime forest">
        <img class="sticky-image" src="https://play-lh.googleusercontent.com/UV4ptzFCTi4sprj3kA1FXpQuGMjl7oFhWHUOqPH5cNgwcmiatn3KNfZ7DTInLZbPzvdR6AElXJj2Encuwmga" alt="Anime image">
        <img class="sticky-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFVQAD1DV3OoO42N3sLAIS6dS1RcpJ36-AHblLnikpEQ&s=10" alt="Anime forest">
        <img class="sticky-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDZWt8LZIOFE-GQGgaKNmR1RCncxeNWhXsVsFi2iIxrqEXEMUaFhRa_zuU&s=10" alt="Anime forest">

    </main>
</body>
</html>
